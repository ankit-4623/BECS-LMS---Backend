<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recorded Lectures – BECS Learning</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #E60000;
            --primary-light: #FF3333;
            --dark: #0a0a0a;
            --light: #ffffff;
            --gray-100: #f9f9fb;
            --gray-200: #eef0f3;
            --gray-600: #64748b;
            --gray-800: #1e293b;
            --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.12);
            --radius: 24px;
            --transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--gray-800);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, .95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, .08);
            padding: 1.2rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 1.85rem;
            color: var(--dark);
            text-decoration: none;
            transition: var(--transition);
        }

        .logo:hover {
            color: var(--primary);
        }

        .logo-svg {
            width: 52px;
            height: 52px;
            margin-right: 16px;
            filter: drop-shadow(0 2px 8px rgba(230, 0, 0, .2));
        }

        .logo:hover .logo-svg {
            transform: rotate(15deg) scale(1.15);
        }

        .back-btn {
            background: var(--primary);
            color: #fff;
            padding: .75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .back-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(230, 0, 0, .3);
        }

        .container {
            flex: 1;
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 5%;
            width: 100%;
        }

        .page-title {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: .5rem;
        }

        .page-subtitle {
            color: var(--gray-600);
            font-size: 1.1rem;
            margin-bottom: 3rem;
            font-weight: 500;
        }

        /* ----- Screens ----- */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Chapter List */
        .chapter-card {
            background: var(--light);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: var(--transition);
        }

        .chapter-card:hover {
            border: 2px solid var(--primary);
            transform: translateY(-4px);
        }

        .chapter-card h3 {
            font-size: 1.35rem;
            margin-bottom: .4rem;
            color: var(--dark);
        }

        .chapter-card p {
            color: var(--gray-600);
            font-size: .95rem;
        }

        /* Lecture List */
        .lecture-item {
            background: var(--gray-100);
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .lecture-item:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .1);
        }

        .lecture-title {
            font-weight: 600;
            color: var(--gray-800);
        }

        .lecture-no {
            background: var(--primary);
            color: #fff;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: .85rem;
            font-weight: 700;
        }

        /* Video Screen */
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-md);
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-title {
            margin-bottom: 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
        }

        footer {
            background: var(--dark);
            color: #ccc;
            padding: 4rem 5% 2.5rem;
            margin-top: auto;
            font-size: .98rem;
            text-align: center;
        }

        .footer-links a {
            color: #ff4d4d;
            text-decoration: none;
            margin: 0 1rem;
            font-weight: 600;
        }

        .copyright {
            color: #888;
            font-size: .9rem;
            margin-top: 1rem;
        }

        @media (max-width:768px) {
            .page-title {
                font-size: 2rem;
            }

            .lecture-item {
                flex-direction: column;
                align-items: flex-start;
                gap: .5rem;
            }

            .lecture-no {
                align-self: flex-end;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <a href="index.html" class="logo" aria-label="BECS Learning Home">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E60000" />
                        <stop offset="100%" stop-color="#FF3333" />
                    </linearGradient>
                    </button>
                    <path d="M50 16 L70 32 L70 68 L50 84 L30 68 L30 32 Z" fill="url(#grad1)" stroke="white"
                        stroke-width="5" />
                    <circle cx="50" cy="50" r="24" fill="white" />
                    <text x="50" y="60" font-family="Inter,sans-serif" font-size="38" font-weight="900" fill="#E60000"
                        text-anchor="middle">B</text>
            </svg>
            <span>BECS Learning</span>
        </a>
        <a href="./student dashboard.html" class="back-btn">Back to Dashboard</a>
    </header>

    <!-- Main Content -->
    <section class="container">

        <h1 class="page-title">Recorded Lectures</h1>
        <p class="page-subtitle">Select a chapter → choose a lecture → watch the video.</p>

        <!-- ==== SCREEN 1: Chapters ==== -->
        <div id="screen-chapters" class="screen active">
            <div id="chapterContainer"></div>
        </div>

        <!-- ==== SCREEN  добавить: Back to Chapters ==== -->
        <div id="screen-lectures" class="screen">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h2 id="lectureChapterTitle" class="video-title"></h2>
                <button class="back-btn" onclick="goBackToChapters()">Back to Chapters</button>
            </div>
            <div id="lectureContainer"></div>
        </div>

        <!-- ==== SCREEN 3: Video Player ==== -->
        <div id="screen-video" class="screen">
            <h2 id="videoTitle" class="video-title"></h2>
            <div class="video-container">
                <iframe id="youtubePlayer" src=""
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
            </div>
            <button class="back-btn" style="margin-top:1rem;" onclick="goBackToLectures()">Back to Lectures</button>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Use</a>
            <a href="#">Support</a>
            <a href="#">Contact</a>
        </div>
        <div class="copyright">
            © 2025 <strong>BECS Learning</strong> | Banerjeee Electronics & Consultancy Services
        </div>
    </footer>

    <script>
        /* -------------------------------------------------
           Hard-coded data
        ------------------------------------------------- */
        const chapters = [
            {
                id: "basics",
                title: "Basics of Electronics",
                description: "Fundamental concepts, Ohm’s law, resistors, capacitors.",
                lectures: [
                    { no: 1, title: "Introduction to Circuits", videoId: "dQw4w9WgXcQ" },
                    { no: 2, title: "Ohm’s Law & Resistor Networks", videoId: "M7lc1UVf-VE" },
                    { no: 3, title: "Capacitors & RC Circuits", videoId: "JZgjjFhnH4I" },
                    { no: 4, title: "Inductors & RL Circuits", videoId: "YQMlQeL-2f0" }
                ]
            },
            {
                id: "digital",
                title: "Digital Logic & Microcontrollers",
                description: "Gates, flip-flops, Arduino basics.",
                lectures: [
                    { no: 1, title: "Logic Gates & Boolean Algebra", videoId: "V0Y9d_NyKXg" },
                    { no: 2, title: "Combinational Circuits", videoId: "U4aXv7uU5kE" },
                    { no: 3, title: "Arduino – Blink LED", videoId: "RfZcN3w9j0Y" }
                ]
            },
            {
                id: "power",
                title: "Power Electronics",
                description: "Rectifiers, inverters, SMPS.",
                lectures: [
                    { no: 1, title: "Half-wave & Full-wave Rectifiers", videoId: "f0n7mN1rXgA" },
                    { no: 2, title: "Buck Converter Basics", videoId: "bJ2gN8tL0nM" }
                ]
            }
        ];

        const $ = id => document.getElementById(id);

        /* -------------------------------------------------
           Rendering
        ------------------------------------------------- */
        function renderChapters() {
            const container = $("chapterContainer");
            container.innerHTML = chapters.map(ch => `
                <div class="chapter-card" onclick="showLectures('${ch.id}')">
                    <h3>${ch.title}</h3>
                    <p>${ch.description}</p>
                </div>
            `).join('');
        }

        let currentChapter = null;

        function showLectures(chapterId) {
            currentChapter = chapters.find(c => c.id === chapterId);
            $("lectureChapterTitle").textContent = currentChapter.title;
            const container = $("lectureContainer");
            container.innerHTML = currentChapter.lectures.map(lec => `
                <div class="lecture-item" onclick="playLecture('${lec.videoId}','${lec.title}')">
                    <span class="lecture-title">${lec.title}</span>
                    <span class="lecture-no">Lecture ${lec.no}</span>
                </div>
            `).join('');

            $("screen-chapters").classList.remove('active');
            $("screen-lectures").classList.add('active');
        }

        function playLecture(videoId, title) {
            $("videoTitle").textContent = title;
            $("youtubePlayer").src = `https://www.youtube.com/embed/${videoId}?rel=0`;

            $("screen-lectures").classList.remove('active');
            $("screen-video").classList.add('active');
        }

        function goBackToLectures() {
            $("screen-video").classList.remove('active');
            $("screen-lectures").classList.add('active');
        }

        /* ==== NEW: Back to Chapters ==== */
        function goBackToChapters() {
            $("screen-lectures").classList.remove('active');
            $("screen-chapters").classList.add('active');
        }

        window.addEventListener('load', renderChapters);
    </script>
</body>

</html>
