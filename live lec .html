<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Lectures – BECS Learning</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        /* ==== CSS Variables ==== */
        :root {
            --primary: #E60000;
            --primary-light: #FF3333;
            --primary-glow: #ff1a1a;
            --dark: #0a0a0a;
            --light: #ffffff;
            --gray-100: #f9f9fb;
            --gray-200: #eef0f3;
            --gray-600: #64748b;
            --gray-800: #1e293b;
            --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.18);
            --radius: 24px;
            --transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ==== Reset & Base ==== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
            border-radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--gray-800);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        /* ==== Header ==== */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding: 1.2rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: <h1>var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 1.85rem;
            color: var(--dark);
            text-decoration: none;
            transition: var(--transition);
            letter-spacing: -0.5px;
        }

        .logo:hover {
            color: var(--primary);
        }

        .logo-svg {
            width: 52px;
            height: 52px;
            margin-right: 16px;
            filter: drop-shadow(0 2px 8px rgba(230, 0, 0, 0.2));
            transition: transform 0.5s ease;
        }

        .logo:hover .logo-svg {
            transform: rotate(15deg) scale(1.15);
        }

        .back-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .back-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(230, 0, 0, 0.3);
        }

        /* ==== Main Content ==== */
        .container {
            flex: 1;
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 5%;
            width: 100%;
        }

        .page-title {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: var(--gray-600);
            font-size: 1.1rem;
            margin-bottom: 3rem;
            font-weight: 500;
        }

        /* ==== Live Status ==== */
        .live-status {
            background: var(--light);
            border-radius: var(--radius);
            padding: 2.5rem;
            margin-bottom: 3rem;
            box-shadow: var(--shadow-md);
            border: 2px solid var(--primary);
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .status-badge {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            animation: pulse 2s infinite;
        }

        .status-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
        }

        .meet-link-section {
            margin-top: 2rem;
        }

        .meet-link-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: 0.75rem;
            display: block;
        }

        .meet-link-display {
            background: var(--gray-100);
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            color: var(--gray-800);
        }

        .join-button {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(230, 0, 0, 0.3);
        }

        .join-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(230, 0, 0, 0.4);
        }

        .join-button:active {
            transform: translateY(-2px);
        }

        .join-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ==== Footer ==== */
        footer {
            background: var(--dark);
            color: #ccc;
            padding: 4rem 5% 2.5rem;
            margin-top: auto;
            font-size: 0.98rem;
        }

        .footer-content {
            max-width: 1360px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .footer-links a {
            color: #ff4d4d;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .footer-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2.5px;
            bottom: -6px;
            left: 0;
            background: var(--primary-light);
            transition: width 0.35s ease;
            border-radius: 2px;
        }

        .footer-links a:hover::after {
            width: 100%;
        }

        .footer-links a:hover {
            color: var(--primary-light);
            transform: translateY(-3px);
        }

        .copyright {
            color: #888;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            font-weight: 500;
        }

        /* ==== Animations ==== */
        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        /* ==== Responsive ==== */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }

            .page-title {
                font-size: 2rem;
            }

            .live-status {
                padding: 1.5rem;
            }

            .join-button {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 1.4rem;
            }

            .logo-svg {
                width: 40px;
                height: 40px;
                margin-right: 12px;
            }

            .page-title {
                font-size: 1.6rem;
            }

            .page-subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <a href="index.html" class="logo" aria-label="BECS Learning Home">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E60000" />
                        <stop offset="100%" stop-color="#FF3333" />
                    </linearGradient>
                </defs>
                <path d="M50 16 L70 32 L70 68 L50 84 L30 68 L30 32 Z" fill="url(#grad1)" stroke="white"
                    stroke-width="5" />
                <circle cx="50" cy="50" r="24" fill="white" />
                <text x="50" y="60" font-family="Inter, sans-serif" font-size="38" font-weight="900" fill="#E60000"
                    text-anchor="middle">B</text>
            </svg>
            <span>BECS Learning</span>
        </a>
        <a href="index.html" class="back-btn">Back to Dashboard</a>
    </header>

    <!-- Main Content -->
    <section class="container">
        <h1 class="page-title">Live Lectures</h1>
        <p class="page-subtitle">Join real-time interactive classes with expert instructors</p>

        <!-- Live Status & Join Section -->
        <div class="live-status">
            <div class="status-header">
                <span class="status-badge">LIVE NOW</span>
                <span class="status-text" id="statusText">Class is currently live</span>
            </div>

            <div class="meet-link-section">
                <label class="meet-link-label">Google Meet Link:</label>
                <div class="meet-link-display" id="meetLinkDisplay">
                    No active class link available
                </div>
                <button class="join-button" id="joinButton" onclick="joinMeeting()" disabled>
                    Join Google Meet
                </button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Use</a>
                <a href="#">Support</a>
                <a href="#">Contact</a>
            </div>

            <div class="copyright">
                © 2025 <strong>BECS Learning</strong> | Banerjeee Electronics & Consultancy Services
            </div>
        </div>
    </footer>

    <script>
        // Load link from localStorage on page load
        function loadMeetLink() {
            const savedLink = localStorage.getItem('meetLink');
            const savedTitle = localStorage.getItem('classTitle');

            if (savedLink) {
                document.getElementById('meetLinkDisplay').textContent = savedLink;
                document.getElementById('joinButton').disabled = false;
            }

            if (savedTitle) {
                document.getElementById('statusText').textContent = savedTitle;
            }
        }

        // Join meeting function
        function joinMeeting() {
            const meetLink = document.getElementById('meetLinkDisplay').textContent;
            if (meetLink && meetLink !== 'No active class link available') {
                window.open(meetLink, '_blank');
            } else {
                alert('No active class link available. Please wait for the admin to publish the link.');
            }
        }

        // Load link on page load
        window.addEventListener('load', loadMeetLink);
    </script>
</body>

</html>
